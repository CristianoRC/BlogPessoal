{{- if .Params.mermaid -}}
<style>
  pre:has(code.language-mermaid) { visibility: hidden; }
</style>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  document.querySelectorAll('code.language-mermaid').forEach(el => {
    const placeholder = document.createElement('div');
    placeholder.dataset.mermaidSource = el.textContent;
    placeholder.hidden = true;
    el.closest('pre').replaceWith(placeholder);
  });

  async function render() {
    const theme = document.documentElement.classList.contains('dark') ? 'dark' : 'default';
    mermaid.initialize({ startOnLoad: false, theme });

    document.querySelectorAll('.mermaid-rendered').forEach(el => el.remove());

    document.querySelectorAll('[data-mermaid-source]').forEach(placeholder => {
      const div = document.createElement('div');
      div.className = 'mermaid mermaid-rendered';
      div.textContent = placeholder.dataset.mermaidSource;
      placeholder.after(div);
    });

    await mermaid.run({ nodes: document.querySelectorAll('.mermaid-rendered') });
  }

  await render();

  new MutationObserver(render).observe(
    document.documentElement,
    { attributes: true, attributeFilter: ['class'] }
  );
</script>
{{- end -}}
